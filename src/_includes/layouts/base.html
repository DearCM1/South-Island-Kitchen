<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/editorial.css" />
    <title>{{ title | default: "South Island Kitchen" }}</title>
    <link rel="icon" type="image/x-icon" href="{{ '/assets/logo/favicon.png' | url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__branding">
          <a href="/" class="site-title">South Island Kitchen</a>
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/recipes/">Recipes</a>
          <a href="/about/">About</a>
          <a href="/archive/">Archive</a>
        </nav>
      </div>
    </header>
    <main class="page">
      <article class="recipe">
        <header class="recipe__header" aria-labelledby="page-title">
          <h1 id="page-title" class="page-title">{{ title | default: "Recipe" }}</h1>
          {% if deck %}
            <p class="recipe__deck">{{ deck }}</p>
          {% endif %}
          {% if meta %}
            <p class="meta">{{ meta }}</p>
          {% endif %}
        </header>
        <section class="page-content">
          {{ content }}
        </section>
      </article>
    </main>
  </body>
</html>
